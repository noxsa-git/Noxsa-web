<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>NOXSA | Modern Websites & Web Applications</title>

    <meta
      name="description"
      content="NOXSA builds modern, fast, and user-focused websites and web applications that help businesses grow, strengthen their online presence, and deliver better digital experiences." />

    <meta
      name="keywords"
      content="NOXSA, web development, website design, web application development, React, MERN stack, business website, digital solutions" />

    <meta name="author" content="NOXSA" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://res.cloudinary.com/ysbpcq4w/image/upload/v1791090860/noxsa-logo.jpg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOXSA" />

    <meta
      property="og:title"
      content="NOXSA | Modern Websites & Web Applications" />

    <meta
      property="og:description"
      content="NOXSA builds modern, fast, and user-focused websites and web applications that help businesses grow, strengthen their online presence, and deliver better digital experiences." />

    <!-- Update when domain is live -->
    <meta property="og:url" content="https://noxsa.com" />

    <meta
      property="og:image"
      content="https://res.cloudinary.com/ysbpcq4w/image/upload/v1791090860/noxsa-logo.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="NOXSA | Modern Websites & Web Applications" />

    <meta
      name="twitter:description"
      content="NOXSA builds modern, fast, and user-focused websites and web applications that help businesses grow, strengthen their online presence, and deliver better digital experiences." />

    <!-- Update when OG image is created -->
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/ysbpcq4w/image/upload/v1791090860/noxsa-logo.jpg" />

    <!-- Update when domain is live -->
    <link rel="canonical" href="https://noxsa.com" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

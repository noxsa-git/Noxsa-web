<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>NOXSA Digital | Modern Websites & Web Applications</title>

    <meta
      name="description"
      content="NOXSA builds modern, fast, and user-focused websites and web applications that help businesses grow, strengthen their online presence, and deliver better digital experiences." />

    <meta
      name="keywords"
      content="NOXSA, web development, website design, web application development, React, MERN stack, business website, digital solutions" />

    <meta name="author" content="NOXSA" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://noxsa.tech/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOXSA Digital" />
    <meta
      property="og:title"
      content="NOXSA | Modern Websites & Web Applications" />
    <meta
      property="og:description"
      content="NOXSA builds modern, fast, and user-focused websites and web applications that help businesses grow, strengthen their online presence, and deliver better digital experiences." />
    <meta property="og:url" content="https://noxsa.tech/" />
    <meta property="og:image" content="https://noxsa.tech/noxsaOG.png" />
    <meta property="og:image:alt" content="NOXSA brand image" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="NOXSA Digital | Modern Websites & Web Applications" />
    <meta
      name="twitter:description"
      content="NOXSA builds modern, fast, and user-focused websites and web applications that help businesses grow, strengthen their online presence, and deliver better digital experiences." />
    <meta name="twitter:image" content="https://noxsa.tech/noxsaOG.png" />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NOXSA",
        "alternateName": "NOXSA Digital",
        "url": "https://noxsa.tech/"
      }
    </script>

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NOXSA",
        "url": "https://noxsa.tech/",
        "logo": "https://noxsa.tech/favicon.jpeg"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
